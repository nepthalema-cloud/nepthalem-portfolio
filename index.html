<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nepthalem Ayele | Full-Stack Developer &amp; Software Engineer</title>
    <meta
      name="description"
      content="Professional software engineering portfolio of Nepthalem Ayele. Full-stack web applications, backend systems, databases, and applied AI/ML integration."
    />
    <script>
      try {
        const theme = localStorage.getItem('portfolio-theme');
        document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
